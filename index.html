
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RBI Rate of Interest Dec 2025</title>
  <style>
    .rate-box {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 20px;
      margin: 30px auto;
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
    }
    .rate-title {
      font-size: 24px;
      font-weight: bold;
    }
    .rate-value {
      font-size: 48px;
      color: #007bff;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="rate-box">
  <div class="rate-title">RBI Repo Rate (Dec 2025)</div>
  <div id="repoRate" class="rate-value">Loading...</div>
</div>

<script>
  // Rate of interest from RBI December 2025
  const rbiRate = "5.25%"; // repo rate
  document.getElementById("repoRate").innerText = rbiRate;
</script>

</body>
</html>
